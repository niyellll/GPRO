name: GPRO two-base offline safety checks
on:
  push:
    branches:
      - audit/two-base-live-reconciliation-20261118
    paths:
      - 'ops/scripts/gpp_rk_transfer_guarded.py'
      - 'ops/tests/test_gpp_rk_guarded.py'
      - 'ops/scripts/csb_klarin_claim_delta_plan.py'
      - 'ops/tests/test_csb_klarin_claim_delta_plan.py'
      - '.github/workflows/gpp-rk-guarded-offline.yml'
  pull_request:
    paths:
      - 'ops/scripts/gpp_rk_transfer_guarded.py'
      - 'ops/tests/test_gpp_rk_guarded.py'
      - 'ops/scripts/csb_klarin_claim_delta_plan.py'
      - 'ops/tests/test_csb_klarin_claim_delta_plan.py'
      - '.github/workflows/gpp-rk-guarded-offline.yml'

permissions:
  contents: read

jobs:
  offline-safety-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile Python syntax without database connections
        run: python3 -m py_compile ops/scripts/gpp_rk_transfer_guarded.py ops/tests/test_gpp_rk_guarded.py ops/scripts/csb_klarin_claim_delta_plan.py ops/tests/test_csb_klarin_claim_delta_plan.py
      - name: Run isolated dry-run and security contract tests
        run: python3 -m unittest discover -s ops/tests -p 'test_*.py' -v
