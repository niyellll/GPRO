name: GPRO two-base offline safety checks
on:
  push:
    branches:
      - audit/two-base-live-reconciliation-20261118
    paths:
      - 'ops/scripts/gpp_rk_transfer_guarded.py'
      - 'ops/tests/test_gpp_rk_guarded.py'
      - 'ops/scripts/csb_finance_audit_transfer_guarded.py'
      - 'ops/tests/test_csb_finance_audit_transfer_guarded.py'
      - 'ops/scripts/csb_klarin_claim_delta_plan.py'
      - 'ops/tests/test_csb_klarin_claim_delta_plan.py'
      - 'ops/scripts/csb_klarin_state_transfer_guarded.py'
      - 'ops/tests/test_csb_klarin_state_transfer_guarded.py'
      - 'ops/scripts/csb_klarin_storage_byte_audit.py'
      - 'ops/tests/test_csb_klarin_storage_byte_audit.py'
      - 'ops/tests/test_bbm_finance_staging_acl.py'
      - 'ops/sql/bbm_finance_v635_staging_anon_acl_READ_ONLY.sql'
      - 'ops/sql/bbm_finance_v635_stage_revoke_anon_REVIEW_ONLY.sql'
      - 'ops/tests/test_two_base_tenant_role_gate.py'
      - 'ops/sql/two_base_finance_tenant_role_gate_READ_ONLY.sql'
      - 'ops/sql/two_base_klarin_tenant_role_gate_READ_ONLY.sql'
      - '.github/workflows/gpp-rk-guarded-offline.yml'
  pull_request:
    paths:
      - 'ops/scripts/gpp_rk_transfer_guarded.py'
      - 'ops/tests/test_gpp_rk_guarded.py'
      - 'ops/scripts/csb_finance_audit_transfer_guarded.py'
      - 'ops/tests/test_csb_finance_audit_transfer_guarded.py'
      - 'ops/scripts/csb_klarin_claim_delta_plan.py'
      - 'ops/tests/test_csb_klarin_claim_delta_plan.py'
      - 'ops/scripts/csb_klarin_state_transfer_guarded.py'
      - 'ops/tests/test_csb_klarin_state_transfer_guarded.py'
      - 'ops/scripts/csb_klarin_storage_byte_audit.py'
      - 'ops/tests/test_csb_klarin_storage_byte_audit.py'
      - 'ops/tests/test_bbm_finance_staging_acl.py'
      - 'ops/sql/bbm_finance_v635_staging_anon_acl_READ_ONLY.sql'
      - 'ops/sql/bbm_finance_v635_stage_revoke_anon_REVIEW_ONLY.sql'
      - 'ops/tests/test_two_base_tenant_role_gate.py'
      - 'ops/sql/two_base_finance_tenant_role_gate_READ_ONLY.sql'
      - 'ops/sql/two_base_klarin_tenant_role_gate_READ_ONLY.sql'
      - '.github/workflows/gpp-rk-guarded-offline.yml'

permissions:
  contents: read

jobs:
  offline-safety-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile Python syntax without database connections
        run: python3 -m py_compile ops/scripts/gpp_rk_transfer_guarded.py ops/tests/test_gpp_rk_guarded.py ops/scripts/csb_finance_audit_transfer_guarded.py ops/tests/test_csb_finance_audit_transfer_guarded.py ops/scripts/csb_klarin_claim_delta_plan.py ops/tests/test_csb_klarin_claim_delta_plan.py ops/scripts/csb_klarin_state_transfer_guarded.py ops/tests/test_csb_klarin_state_transfer_guarded.py ops/scripts/csb_klarin_storage_byte_audit.py ops/tests/test_csb_klarin_storage_byte_audit.py ops/tests/test_bbm_finance_staging_acl.py ops/tests/test_two_base_tenant_role_gate.py
      - name: Run isolated dry-run and security contract tests
        run: python3 -m unittest discover -s ops/tests -p 'test_*.py' -v
